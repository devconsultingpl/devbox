# devbox — the canonical compose skeleton (D7: the host trusts this file, and it
# resolves from this repo, never from a mounted project).
#
# Every value here is either profile-independent or comes from the environment
# that bin/devbox sets. A profile from profiles/ is merged on top of this file and
# supplies the toolchain layer, the harness, and any services.
#
#   docker compose -f compose/devbox.compose.yaml -f profiles/<p>.yaml config
#
# Invariants I1–I6 (AGENTS.md) are what `devbox doctor` checks the effective form
# of this file against.
name: ${DEVBOX_PROJECT_NAME:?set by bin/devbox}

services:
  # The base layer of the chain: the toolchain image the devbox service builds on
  # top of (A5 — the harness seam lives in this layer, so a profile selects its
  # harness here). It is never started, only built, and it is tagged by profile so
  # the tag is the same no matter which project is being worked in.
  devbox-base:
    image: devbox/base-${DEVBOX_PROFILE:?set by bin/devbox}:local
    profiles: ["build"]
    build:
      context: ${DEVBOX_REPO:?set by bin/devbox}
      dockerfile: images/base/Dockerfile
      args:
        HARNESS: none

  devbox:
    image: devbox/dev-${DEVBOX_PROFILE:?set by bin/devbox}:local

    # The toolchain layer and the harness come from the profile; these defaults
    # are the bare base image (profiles/base.yaml).
    build:
      context: ${DEVBOX_REPO:?set by bin/devbox}
      dockerfile: images/base/Dockerfile
      args:
        HARNESS: none

    # The host paths in the container are the worktree and its gitdir, mounted at
    # their own absolute paths so git's metadata — the worktree's `.git` file and
    # its backlink, both absolute — resolves unchanged on both sides (0003 D1,
    # ADR 0001 amendment). The hooks directory is mounted read-only: the one file class that
    # escapes into automatic host execution (D4). Nothing else from the host.
    volumes:
      - type: bind
        source: ${DEVBOX_WORKTREE:?set by bin/devbox}
        target: ${DEVBOX_WORKTREE:?set by bin/devbox}
      - type: bind
        source: ${DEVBOX_GITDIR:?set by bin/devbox}
        target: ${DEVBOX_GITDIR:?set by bin/devbox}
        read_only: ${DEVBOX_GITDIR_RO:-false}
      - type: bind
        source: ${DEVBOX_GITDIR:?set by bin/devbox}/hooks
        target: ${DEVBOX_GITDIR:?set by bin/devbox}/hooks
        read_only: true

    # No /workspace: the working directory is the tree's own host path. Review-only
    # boxes read a read-only gitdir, so git must not try to refresh the index (D2).
    working_dir: ${DEVBOX_WORKTREE:?set by bin/devbox}
    environment:
      GIT_OPTIONAL_LOCKS: "0"
    init: true
    # The container is a place to work in, not a process: keep it alive so
    # `devbox shell` can exec into it.
    command: ["sleep", "infinity"]
    networks:
      - devbox
    restart: "no"

networks:
  devbox:
