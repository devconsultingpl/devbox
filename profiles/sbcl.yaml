# Profile: sbcl — Common Lisp (SBCL) + slr, harness pi.
#
# Build inputs: `base`, the base image built with this profile's harness (A5 — the
# harness seam lives in the base layer), and `slr`, slr's source tree. That repo is
# private and this one is public, so the source arrives as a context, never a clone
# (A3): git -C <slr checkout> archive HEAD | tar -x -C "$SLR_SRC"
#
# `.slr/` is an anonymous, container-private volume (D10): socket, marker and image
# live there — never in the host project — and `devbox down` takes the volume too.
services:
  devbox-base:
    build:
      args:
        HARNESS: pi

  devbox:
    build:
      context: ${DEVBOX_REPO:?set by bin/devbox}
      dockerfile: images/sbcl/Dockerfile
      additional_contexts:
        base: service:devbox-base
        slr: ${SLR_SRC:?set by bin/devbox}
    volumes:
      - /workspace/.slr
