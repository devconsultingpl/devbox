# Profile: sbcl — Common Lisp (SBCL) + slr, harness pi.
#
# Build inputs: `base` (the base image with this profile's harness — A5) and `slr`
# (slr's source tree; private repo, so a context, never a clone — A3):
#   git -C <slr checkout> archive HEAD | tar -x -C "$SLR_SRC"
#
# `.slr/` is a container-private volume named `devbox-<worktree>-slr` (D10); `down`
# removes it via that volume's compose labels, from any state (A8, A15). It lives
# inside the worktree, which is mounted at its own host path (0003 D1).
services:
  devbox-base:
    build:
      args:
        HARNESS: pi

  devbox:
    build:
      context: ${DEVBOX_REPO:?set by bin/devbox}
      dockerfile: images/sbcl/Dockerfile
      additional_contexts:
        base: service:devbox-base
        slr: ${SLR_SRC:?set by bin/devbox}
    volumes:
      - devbox-slr:${DEVBOX_WORKTREE:?set by bin/devbox}/.slr

volumes:
  devbox-slr:
    name: devbox-${DEVBOX_PROJECT_NAME:?set by bin/devbox}-slr
