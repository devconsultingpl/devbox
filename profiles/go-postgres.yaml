# Profile: go-postgres — Go toolchain (harness pi) plus a postgres service: pinned
# upstream image, private `devbox` network, no host port (criterion 6), data in a
# named volume that survives `devbox down` and goes only on `down --purge` (A8).
# Slice 4 verifies the session; the profile is authored here so `doctor` covers it.
services:
  devbox-base:
    build:
      args:
        HARNESS: pi

  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: devbox, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: devbox}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [devbox]

  devbox:
    build:
      context: ${DEVBOX_REPO:?set by bin/devbox}
      dockerfile: images/go/Dockerfile
      additional_contexts: {base: service:devbox-base}
    depends_on: [postgres]

volumes:
  postgres-data:
